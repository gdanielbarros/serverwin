  <circle cx="45" cy="444" r="4" fill="#00FF87"/>
  <text x="56" y="449" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#6EE7B7" letter-spacing="1">TECH SPECIALIST</text>
