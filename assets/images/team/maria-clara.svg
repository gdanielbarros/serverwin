      <stop stop-color="#1B1736" offset="0%"/>
      <stop stop-color="#080C14" offset="100%"/>
    </radialGradient>
    <linearGradient id="stroke-glow-2" x1="0" y1="0" x2="400" y2="500">
      <stop stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg-glow-2)"/>
  <!-- Technical Grid overlay -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="380" y1="480" x2="340" y2="480" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="380" y1="480" x2="380" y2="440" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
  
  <!-- Abstract Portrait Silhouette -->
  <circle cx="200" cy="190" r="65" fill="#201C3E" stroke="url(#stroke-glow-2)" stroke-width="2"/>
  <path d="M120 370 C120 280, 280 280, 280 370" fill="#201C3E" stroke="url(#stroke-glow-2)" stroke-width="2"/>
  
  <!-- Tech Initials -->
  <text x="200" y="202" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="38" fill="#C4B5FD" letter-spacing="2">MC</text>
  
