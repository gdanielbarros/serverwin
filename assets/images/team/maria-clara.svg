  <circle cx="45" cy="444" r="4" fill="#A78BFA"/>
  <text x="56" y="449" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C4B5FD" letter-spacing="1">ECONOMY / DEV</text>
