      <stop stop-color="#080C14" offset="100%"/>
    </radialGradient>
    <linearGradient id="stroke-glow-4" x1="0" y1="0" x2="400" y2="500">
      <stop stop-color="#F43F5E" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.05"/>
